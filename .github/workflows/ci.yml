name: CI

# Pull requests only: main requires PRs to be up to date before a squash
# merge, so the merged tree is the one CI already tested.
on:
  pull_request:

# A new push to a PR cancels that PR's older, now-stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # One job on the oldest supported Python, to keep runner use low.
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install build -e ".[dev]"
      - run: python -m pytest -q
      - run: |
          ruff check .
          ruff format --check .
          python -m build
          # The release workflow installs this lock file; catch bad pins or hashes here.
          python -m pip download -q --only-binary=":all:" --require-hashes -r requirements-release.txt -d "$RUNNER_TEMP/release-deps"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: aislop
        run: |
          set -o pipefail
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npx --yes aislop@0.16.1 ci . --human | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
