[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "subbridge"
version = "0.2.0a1"
description = "Prototype with the official Anthropic and OpenAI SDKs on your Claude or ChatGPT subscription, then ship with an API key"
keywords = ["claude", "claude-code", "codex", "anthropic", "openai", "anthropic-sdk", "openai-sdk", "llm", "gateway", "prototyping", "ai-agents", "cli-wrapper", "subscription"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.setuptools.packages.find]
include = ["subbridge*"]

[tool.setuptools.package-data]
subbridge = ["py.typed"]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
    "anthropic==1.8.0",
    "openai==3.19.2",
]

[project.urls]
Homepage = "https://github.com/kunjan-p/subbridge"
Repository = "https://github.com/kunjan-p/subbridge"
Issues = "https://github.com/kunjan-p/subbridge/issues"
Changelog = "https://github.com/kunjan-p/subbridge/blob/main/CHANGELOG.md"

[project.scripts]
subbridge = "subbridge.cli:main"
